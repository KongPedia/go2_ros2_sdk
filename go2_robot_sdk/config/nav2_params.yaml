bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False

    # [수정] 제어 주기 (3.0 -> 10.0 Hz)
    # 원본: 3.0    # [수정] 원본 5.0 -> 20.0
    # FreeAvoid 환경: 20Hz로 높여 실시간 trajectory 변화에 빠르게 대응
    controller_frequency: 20.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    
    # [전략] Controller는 경로 추종만, 장애물 회피는 SDK FreeAvoid에 의존
    # Nav2 controller는 최소한의 경로 추종만 수행
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.02
      movement_time_allowance: 6.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5  # 0.25 -> 0.5 (목표 지점 근처 도착 시 성공 판정)
      yaw_goal_tolerance: 0.5  # 0.25 -> 0.5 (~28도, 방향 허용 오차 증가)

    # ============================================================================
    # Pure Pursuit Controller - 단순 경로 추종만 수행
    # ============================================================================
    # 역할: Nav2 경로를 따라가기만 함 (장애물 회피 X)
    # 장애물 회피: SDK FreeAvoid (command 2048)에 전적으로 의존
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.8  # 0.5 -> 0.8 (속도 증가)
      # [FreeAvoid 최적화] lookahead 증가: path deviation 대응
      lookahead_dist: 0.8  # 0.6 -> 0.8
      min_lookahead_dist: 0.4  # 0.3 -> 0.4
      max_lookahead_dist: 1.2  # 0.9 -> 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.4
      transform_tolerance: 0.1
      # [FreeAvoid 최적화] 속도 변화에 따른 lookahead 조정
      use_velocity_scaled_lookahead_dist: true  # false -> true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      
      # [비활성화] Collision Detection - SDK FreeAvoid에 맡김
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 2.0
      
      # [비활성화] Cost-based Velocity Scaling - SDK FreeAvoid에 맡김
      use_cost_regulated_linear_velocity_scaling: false
      
      # [FreeAvoid 최적화] Regulated Linear Velocity Scaling 완화
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 1.5  # 0.9 -> 1.5 (FreeAvoid deviation 허용)
      regulated_linear_scaling_min_speed: 0.25
      
      use_rotate_to_heading: false
      allow_reversing: false
      
      # [FreeAvoid 최적화] 회전 임계값 완화 (path oscillation 방지)
      rotate_to_heading_min_angle: 0.35  # 0.26 -> 0.35 (20도)
      max_angular_accel: 0.4
      max_robot_pose_search_dist: 10.0
      use_interpolation: false

local_costmap:
  local_costmap:
    ros__parameters:
      # [수정] 업데이트 빈도 (3.0 -> 5.0 Hz)
      update_frequency: 10.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      # [변경] 원본 5x5 -> 8x8
      # 이유: 로컬 costmap 창이 너무 작으면 장애물을 "가까워서야" 반영하게 되어 회피 시작이 늦어짐(회피 여유 거리 확보)
      # 원본 6 -> 5 (연산량 최적화)
      width: 5 
      height: 5
      resolution: 0.05
      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"
      # [변경] 원본 0.03 -> 0.05
      # 이유: footprint를 조금 더 크게 잡아 벽/장애물 최소 이격을 확보(단, 좁은 문틀 통과가 막히면 0.03~0.05에서 조정)
      footprint_padding: 0.03
  
      # [수정] static_layer 복원, inflation_layer는 제거 유지
      # 이유: Controller가 맵의 벽을 인식해야 경로 생성 가능
      # Inflation은 제거하여 SDK FreeAvoid에 회피 맡김
      plugins: ["static_layer", "obstacle_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: -0.2
          observation_persistence: 0.0
          inf_is_valid: true
          clearing: True
          marking: True
          data_type: "LaserScan"
          # [변경] 원본 3.0 -> 8.0
          # 이유: 더 먼 거리의 free-space 클리어링을 반영하여 costmap 잔상/오탐으로 좁은 길이 막히는 현상 완화
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          # [변경] 원본 2.5 -> 7.0
          # 이유: 더 멀리서 장애물을 costmap에 올려 회피를 일찍 시작(회피 범위 확대)
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

      # [비활성화] inflation_layer 제거
      # 이유: Costmap은 장애물 위치만 표시하고, 실제 회피 거리는 controller가 결정하도록 함
      # Controller의 collision detection과 free avoid 기능에 전적으로 의존
      # inflation_layer:
      #   plugin: "nav2_costmap_2d::InflationLayer"
      #   cost_scaling_factor: 5.0
      #   inflation_radius: 0.35

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      resolution: 0.05

      # [수정] Unknown Space 추적 (False -> True)
      # 원본: False (Unknown을 Free로 보거나 닫아버림)
      # 수정: True (Planner가 Unknown 영역을 인식하고 allow_unknown: true 옵션으로 지나가게 함)
      track_unknown_space: True

      static_map: True
      footprint: "[ [0.380, 0.230], [0.380, -0.230], [-0.480, -0.230], [-0.480, 0.230] ]"
      # [최소화] 벽 근처 목표 허용을 위해 padding 최소화
      footprint_padding: 0.01  # 0.03 -> 0.01

      # [수정] Obstacle Layer 추가, inflation_layer 최소화
      # 원본: ["static_layer", "voxel_layer", "inflation_layer"]
      # 수정: Voxel(3D) 대신 Obstacle(2D) 레이어 사용 권장 (Jetson 부하 감소 및 설정 단순화)
      #      반드시 센서 데이터(obstacle_layer)가 있어야 맵에 없는 장애물을 피해서 경로를 생성함.
      # Global은 경로 계획용이므로 최소한의 inflation 유지 (local은 완전 제거)
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        map_subscribe_transient_local: True

      # [추가된 블록] 동적 장애물 반영을 위해 추가
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: -0.2
          observation_persistence: 0.0
          inf_is_valid: true
          clearing: True
          marking: True
          data_type: "LaserScan"
          # [변경] 원본 3.0 -> 8.0
          # 이유: 글로벌 costmap에서도 더 먼 거리의 free-space 클리어링 반영(동적 장애물 변화 반영성 개선)
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          # [변경] 원본 2.5 -> 7.0
          # 이유: 맵에 없는 동적 장애물을 더 멀리서 반영하여 경로 자체가 장애물을 크게 우회하도록 유도
          obstacle_max_range: 7.0
          obstacle_min_range: 0.0

      # [주석 처리된 원본] Voxel Layer
      # 3D 센서를 쓴다면 이걸 써야 하지만, 2D Scan만 쓴다면 Obstacle Layer가 훨씬 가볍고 효율적임.
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   ...

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # [변경] cost_scaling_factor 3.0 -> 20.0
        # 이유: 벽 주변 비용을 매우 급격히 감소시켜 inflation 영향 최소화
        # Global은 경로 계획만 담당하고, 실제 회피는 controller에 맡김
        cost_scaling_factor: 20.0
        # [변경] inflation_radius 0.40 -> 0.10
        # 이유: 맵 벽 주변 팽창 반경을 최소화 (footprint 크기 정도만 유지)
        # Local costmap은 inflation 완전 제거, Global은 최소한만 유지
        inflation_radius: 0.10

map_server:
  ros__parameters:
    use_sim_time: False
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    # [수정] 플러그인 변경 (GridBased -> NavFnPlanner)
    planner_plugins: ["GridBased"]
    use_sim_time: False # 원본 True -> False 수정

    # [교체된 블록] NavFnPlanner (가볍고 일반적인 주행용)
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # [증가] 벽 근처 목표 허용을 위해 tolerance 증가
      tolerance: 0.5  # 2.0 -> 0.5 (정확한 목표 지점 사용)
      use_astar: true       # A* 사용 (최단경로 보장)
      allow_unknown: true    # [중요] True로 해야 맵의 회색(Unknown) 영역을 경로로 생성함

    # [주석 처리된 원본] SmacPlannerHybrid
    # 이유: Jetson에서 돌리기에 무겁고, allow_unknown 처리가 복잡함. Go2는 Ackermann(차량)이 아님.
    # GridBased:
    #   plugin: "nav2_smac_planner/SmacPlannerHybrid"
    #   tolerance: 3.0
    #   allow_unknown: false
    #   motion_model_for_search: "REEDS_SHEPP"
    #   ... (나머지 Smac 파라미터들 생략 없이 주석 처리 했다고 가정) ...

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]

    # [수정] True -> False
    # 중요: 원본에 True로 되어 있었음. 실제 로봇 주행 시 반드시 False여야 TF 에러 없이 복구 동작 수행 가능.
    use_sim_time: False

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [속도 증가] max_velocity 0.5 -> 0.8 m/s
    max_velocity: [0.6, 0.0, 0.6]  # [linear_x, linear_y, angular_z]
    min_velocity: [-0.6, 0.0, -0.6]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # [가속도 증가] 더 빠른 가속/감속
    max_accel: [1.0, 0.0, 1.0]  # 0.8 -> 1.2
    max_decel: [-1.0, 0.0, -1.0]  # -0.8 -> -1.2
    odom_topic: "odom"
    odom_duration: 0.1
    use_realtime_priority: false

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
